<!doctype html>
<html lang="en" data-theme="dark">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<meta
			name="description"
			content="Ash - Minecraft Bedrock Add-on Developer, Full Stack Engineer, and AI Systems Integrator."
		/>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
		<link
			href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap"
			rel="stylesheet"
		/>
		<script src="%sveltekit.assets%/theme-init.js"></script>
		<style>
			:root,
			html[data-theme='dark'] {
				background-color: oklch(14% 0.005 285.823);
				color: oklch(95% 0 0);
				color-scheme: dark;
			}
			html[data-theme='light'] {
				background-color: oklch(97.5% 0.002 285.823);
				color: oklch(15% 0.005 285.823);
				color-scheme: light;
			}
			body {
				margin: 0;
				padding: 0;
				overflow-x: hidden;
			}
		</style>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
